services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  - type: web
    name: threedviewer-backend-50ek
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/configurator.db
      - key: ALLOWED_ORIGINS
        value: https://threedviewer-r6am.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://threedviewer-backend-50ek.onrender.com
      - key: DATA_DIR
        value: /app/data
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 1

  # ── Frontend (Vite static site) ────────────────────────────────
  - type: web
    name: threedviewer-r6am
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://threedviewer-backend-50ek.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
